{% extends 'base.html' %}

{% block contant %}
    {% for product in products %}
        <div class="card" style="width: 16rem; margin-right: 2.5rem; align-items: center">
            <img src="{{ product.image.url }}" class="card-img-top" alt="..." style="width: 120px; height: 120px;">
            <div class="card-body">
                <h5 class="card-title">{{ product.name }}</h5>
            </div>
            <div style="display: flex; flex-direction: row; margin-bottom: 10px;">
                <a href="{% url 'admin_user:admin_update_product' product.id %}" class="btn btn-outline-primary">ویرایش</a>
                &nbsp;&nbsp;&nbsp;
                <a href="{% url 'admin_user:admin_delete_product' product.id %}" class="btn btn-outline-danger">حذف</a>
            </div>
        </div>
    {% endfor %}
    &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
    <a href="{% url 'admin_user:admin_add_product' %}" class="btn btn-success" style="width: 150px; height: 40px;">اضافه کردن</a>
{% endblock %}
